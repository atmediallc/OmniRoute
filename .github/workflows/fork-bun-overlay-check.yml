name: Fork Bun Overlay Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - Dockerfile.bun
      - Dockerfile
      - scripts/fork/prepare-bun-dockerfile.mjs
      - tests/unit/build/fork-bun-dockerfile-overlay.test.mjs
      - tests/unit/build/dockerfile-bun-*.test.mjs
      - .github/workflows/docker-bun-publish.yml
      - .github/workflows/fork-bun-overlay-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate upstream Dockerfile and fork overlay
        run: |
          set -euo pipefail
          node --test tests/unit/build/dockerfile-bun-runner-base-packages.test.mjs tests/unit/build/dockerfile-bun-web-playwright-chromium.test.mjs tests/unit/build/fork-bun-dockerfile-overlay.test.mjs
          cp Dockerfile.bun "$RUNNER_TEMP/Dockerfile.bun"
          node scripts/fork/prepare-bun-dockerfile.mjs "$RUNNER_TEMP/Dockerfile.bun"
          git diff --exit-code
